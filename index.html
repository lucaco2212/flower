<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La primavera florece</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <input class="reveal-toggle" type="checkbox" id="reveal" />
      <div class="sun-glow"></div>
      <div class="sun"></div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>

      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">un pequeño regalo para ti</p>
        <h1 id="intro-title">Hay algo floreciendo</h1>
        <label class="open-button" for="reveal"><span>Ábreme</span><i></i></label>
      </section>

      <section class="garden" aria-labelledby="spring-message">
        <div class="sparkles" aria-hidden="true">
          <b></b><b></b><b></b><b></b><b></b><b></b>
        </div>
        <p class="season">Una nueva estación comienza</p>
        <h2 id="spring-message">Feliz llegada<br /><em>de la primavera</em></h2>
        <div class="sunflower" aria-label="Un girasol abriéndose">
          <div class="petals" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="center"><span></span></div>
          <div class="stem"></div>
          <div class="leaf leaf-left"></div>
          <div class="leaf leaf-right"></div>
        </div>
        <div class="meadow" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
